version: 2.1

orbs:
  goreleaser: hubci/goreleaser@1.0.0
  go: circleci/go@2.2.3
  terraform: circleci/terraform@2.1.0
  wait-for: cobli/wait-for@0.0.2

parameters:
  go-version:
    type: enum
    enum: ["1.23.4"]
    default: "1.23.4"

executors:
  default:
    docker:
      - image: cimg/go:<< pipeline.parameters.go-version >>
  vm:
    machine:
      image: ubuntu-2004:current
    environment:
      GOMODCACHE: /home/circleci/go/pkg/mod

jobs:
  build:
    executor: default
    steps:
      - checkout
      - go/load-mod-cache
      - go/mod-download
      - go/save-mod-cache
      - run:
          name: Build provider
          command: make install

  install-go-deps-vm:
    executor: vm
    steps:
      - checkout
      - go/install:
          version: << pipeline.parameters.go-version >>
      - go/load-mod-cache:
          key: "v3"
      - go/mod-download
      - go/save-mod-cache:
          key: "v3"

  acceptance-tests:
    parameters:
      dokku-version:
        type: string
      plugins:
        description: Major version of the dokku datastore plugins (postgres, redis, mysql, clickhouse) to test against
        type: enum
        enum: ["1.x", "2.x"]
    environment:
      DOKKU_SSH_HOST: "127.0.0.1"
      DOKKU_SSH_PORT: 3022
      DOKKU_SSH_CERT: "/home/circleci/project/dokku-ssh"
      DOKKU_SSH_CERT_WITH_PASSPHRASE: "/home/circleci/project/dokku-ssh-with-passphrase"
      TF_LOG: DEBUG
      TF_LOG_PATH: terraform.log
      TEST_RESULTS: /tmp/test-results
    executor: vm
    steps:
      - checkout
      - go/install:
          version: << pipeline.parameters.go-version >>
      - go/load-mod-cache:
          key: "v3"
      - terraform/install:
          terraform_version: "1.1.5"
      - run:
          name: Install gotestsum
          command: |
            curl -sSL https://github.com/gotestyourself/gotestsum/releases/download/v1.7.0/gotestsum_1.7.0_linux_amd64.tar.gz | \
            sudo tar -zx -C /usr/bin gotestsum
      - run:
          name: Create test results dir
          command: mkdir -p $TEST_RESULTS 
      - run:
          name: Pull dokku image
          command: |
            sudo docker pull dokku/dokku:<< parameters.dokku-version >>
      - run:
          name: Pull other images used in testing
          command: |
            sudo docker pull postgis/postgis:18-3.6
            sudo docker pull circleci/redis:6.2.5
            sudo docker pull mysql:5.7.36
      - run:
          name: Start dokku container
          # The /var/lib/dokku/services/:/var/lib/dokku/services/ volume
          # seems necessary to stop issues with syncing service data - clickhouse
          # in particular wouldn't even start
          command: |
            sudo docker container run \
              --env DOKKU_HOSTNAME=dokku.me \
              --name dokku \
              --publish 3022:22 \
              --publish 8080:80 \
              --publish 8443:443 \
              --volume /var/lib/dokku:/mnt/dokku \
              --volume /var/lib/dokku/services/:/var/lib/dokku/services/ \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              -d \
              dokku/dokku:<< parameters.dokku-version >>
      - run:
          name: Setup SSH key with container
          command: |
            ssh-keygen -t rsa -N "" -f dokku-ssh
            sudo docker cp dokku-ssh.pub dokku:/tmp/dokku-ssh.pub
            sudo docker exec dokku dokku ssh-keys:add dokku dokku-ssh.pub
            # need one with a passphrase too
            ssh-keygen -t rsa -N "foobar" -f dokku-ssh-with-passphrase
            sudo docker cp dokku-ssh-with-passphrase.pub dokku:/tmp/dokku-ssh-with-passphrase.pub
            sudo docker exec dokku dokku ssh-keys:add dokku-passphrase dokku-ssh-with-passphrase.pub
      - wait-for/sh-command:
          timeout: 300
          sh-command: ssh -i dokku-ssh dokku@127.0.0.1 -p 3022
      - run:
          name: Give the dokku user access to the docker socket
          # The dokku/dokku image runs the docker CLI through sudo, but the 2.x
          # datastore plugins also talk to the docker API directly as the dokku
          # user (e.g. to run the ambassador container for exposed services).
          # Add the dokku user to whichever group owns the mounted socket.
          command: |
            sudo docker exec dokku bash -c '
              set -e
              gid=$(stat -c %g /var/run/docker.sock)
              group=$(getent group "$gid" | cut -d: -f1)
              if [ -z "$group" ]; then
                group=docker-host
                groupadd -g "$gid" "$group"
              fi
              usermod -aG "$group" dokku
              id dokku
            '
      - when:
          condition:
            equal: ["1.x", << parameters.plugins >>]
          steps:
            - run:
                name: Install dokku plugins (last 1.x releases)
                command: |
                  sudo docker exec dokku sudo dokku plugin:install https://github.com/dokku/dokku-postgres.git --committish 1.48.0 --name postgres
                  sudo docker exec dokku sudo dokku plugin:install https://github.com/dokku/dokku-redis.git --committish 1.44.1 --name redis
                  sudo docker exec dokku sudo dokku plugin:install https://github.com/dokku/dokku-mysql.git --committish 1.44.3 --name mysql
                  sudo docker exec dokku sudo dokku plugin:install https://github.com/dokku/dokku-clickhouse.git --committish 1.49.2 --name clickhouse
      - when:
          condition:
            equal: ["2.x", << parameters.plugins >>]
          steps:
            - run:
                name: Install dokku plugins (latest)
                command: |
                  sudo docker exec dokku sudo dokku plugin:install https://github.com/dokku/dokku-postgres.git --name postgres
                  sudo docker exec dokku sudo dokku plugin:install https://github.com/dokku/dokku-redis.git --name redis
                  sudo docker exec dokku sudo dokku plugin:install https://github.com/dokku/dokku-mysql.git --name mysql
                  sudo docker exec dokku sudo dokku plugin:install https://github.com/dokku/dokku-clickhouse.git --name clickhouse
      - run:
          name: List installed dokku plugins
          command: sudo docker exec dokku dokku plugin:list
      - run:
          name: Run acceptance tests
          command: make testacc-ci
          no_output_timeout: 1h
      - store_artifacts:
          path: terraform.log
      - store_artifacts: # upload test summary for display in Artifacts
          path: /tmp/test-results
          destination: raw-test-output
      - store_test_results: # upload test results for display in Test Summary
          path: /tmp/test-results

  build-docs:
    docker:
      - image: cimg/go:1.23
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install tfplugindocs
          command: go install github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@latest
      - run:
          name: Generate docs
          command: tfplugindocs generate --provider-name terraform-provider-dokku
      - persist_to_workspace:
          root: .
          paths:
            - docs/

  release:
    parameters:
      dry-run:
        type: boolean
        default: true
    executor: default
    resource_class: large
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Import signing key
          command: |
            echo $OSS_SIGNING_KEY | base64 --decode | gpg --batch --no-tty --import --yes
            touch /tmp/.circleci-gpg-setup
            echo $OSS_SIGNING_PASS | gpg -a --detach-sign --passphrase-fd 0 --pinentry-mode loopback /tmp/.circleci-gpg-setup
      - goreleaser/install:
          version: "2.6.1"
      - when:
          condition: << parameters.dry-run >>
          steps:
          - run:
              command: goreleaser --release-notes=changes/<< pipeline.git.tag >>.md --skip=publish
              no_output_timeout: 30m
      - unless:
          condition: << parameters.dry-run >>
          steps:
          - run:
              command: goreleaser --release-notes=changes/<< pipeline.git.tag >>.md
              no_output_timeout: 30m

workflows:
  build:
    jobs:
      - build
      - install-go-deps-vm

      - acceptance-tests:
          matrix:
            parameters:
              dokku-version:
                - "0.30.11"
                - "0.31.5"
                - "0.32.4"
                - "0.33.9"
                - "0.34.9"
                - "0.35.20"
                - "0.36.11"
              plugins: ["1.x", "2.x"]
            # The 2.x plugins require dokku 0.35+
            exclude:
              - dokku-version: "0.30.11"
                plugins: "2.x"
              - dokku-version: "0.31.5"
                plugins: "2.x"
              - dokku-version: "0.32.4"
                plugins: "2.x"
              - dokku-version: "0.33.9"
                plugins: "2.x"
              - dokku-version: "0.34.9"
                plugins: "2.x"
          requires:
            - build
            - install-go-deps-vm

      - build-docs:
          requires:
            - build

      - release:
          dry-run: false
          context:
            - github-release
            - oss-signing-key
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore:
                - /.*/

